<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Velno</title>
<style>body{font-family:Arial,sans-serif;background:#101010;color:#f5f5f5;padding:16px}input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:8px;border:0;box-sizing:border-box}button{background:#d9ad55;font-weight:bold}pre{white-space:pre-wrap;word-break:break-all;background:#1b1b1b;padding:12px;border-radius:8px}</style></head><body>
<h2>Test de connexion Velno</h2>
<pre id="log">Démarrage…</pre>
<input id="mail" type="email" placeholder="e-mail de test">
<input id="pass" type="password" placeholder="mot de passe (6 caractères minimum)">
<button id="up">Tester l'inscription</button>
<button id="inn">Tester la connexion</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
var log=document.getElementById('log');
function say(t){log.textContent+='\n'+t}
window.onerror=function(m){say('ERREUR JS : '+m)};
var db=null;
async function start(){
  say('1. Bibliothèque Supabase : '+(window.supabase?'OK':'ABSENTE'));
  try{
    var r0=await fetch('index.html',{cache:'no-store'});
    var t=await r0.text();
    say('2. index.html en ligne utilise Supabase : '+(t.indexOf('supabase.co')>-1?'OUI':'NON (ancienne version)'));
  }catch(x){say('2. Lecture de index.html : '+x.message)}
  if(!window.supabase)return;
  db=window.supabase.createClient('https://xnsbfjvqjzjuacszglrq.supabase.co','sb_publishable_RPo64LDZ2HNmg4WIxulcVw_0708uRCO');
  say('3. Client créé : OK');
  try{
    var r=await db.from('stores').select('id',{count:'exact',head:true});
    say('4. Lecture des boutiques : '+(r.error?'ERREUR '+r.error.message:'OK ('+r.count+' boutique(s))'));
  }catch(x){say('4. Lecture : EXCEPTION '+x.message)}
}
start();
document.getElementById('up').onclick=async function(){
  if(!db){say('Pas de client');return}
  say('Inscription en cours…');
  try{
    var r=await db.auth.signUp({email:document.getElementById('mail').value.trim(),password:document.getElementById('pass').value});
    if(r.error)say('Inscription : ERREUR '+r.error.message+' (statut '+r.error.status+')');
    else say('Inscription : OK, session ouverte : '+(r.data.session?'oui':'non'));
  }catch(x){say('Inscription : EXCEPTION '+x.message)}
};
document.getElementById('inn').onclick=async function(){
  if(!db){say('Pas de client');return}
  say('Connexion en cours…');
  try{
    var r=await db.auth.signInWithPassword({email:document.getElementById('mail').value.trim(),password:document.getElementById('pass').value});
    if(r.error)say('Connexion : ERREUR '+r.error.message+' (statut '+r.error.status+')');
    else say('Connexion : OK');
  }catch(x){say('Connexion : EXCEPTION '+x.message)}
};
</script></body></html>
