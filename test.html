<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Velno</title>
<style>body{font-family:Arial,sans-serif;background:#101010;color:#f5f5f5;padding:16px}pre{white-space:pre-wrap;word-break:break-all;background:#1b1b1b;padding:12px;border-radius:8px}</style></head><body>
<h2>Détecteur d'erreurs Velno</h2>
<pre id="log">Démarrage…</pre>
<script>
var log=document.getElementById('log');
function say(t){log.textContent+='\n'+t}
window.onerror=function(m,s,l){say('ERREUR (page de test) : '+m+' ligne '+l)};
async function run(){
  say('Lecture de index.html…');
  var html;
  try{
    var r=await fetch('index.html?nocache='+Date.now(),{cache:'no-store'});
    html=await r.text();
  }catch(x){say('Lecture impossible : '+x.message);return}
  say('Taille : '+html.length+' caractères');
  say('Fin du fichier : '+JSON.stringify(html.slice(-30)));
  say('Balises script : '+(html.match(/<script/g)||[]).length);
  say('Contient openSpace : '+(html.indexOf('function openSpace')>-1?'oui':'NON'));
  var hook='<script>window.onerror=function(m,s,l,c){parent.say("ERREUR dans index.html : "+m+" (ligne "+l+", colonne "+c+")")};window.addEventListener("unhandledrejection",function(e){parent.say("PROMESSE REFUSEE : "+(e.reason&&e.reason.message?e.reason.message:e.reason))});<\/script>';
  var patched=html.replace('<head>','<head>'+hook);
  var f=document.createElement('iframe');
  f.style.cssText='width:1px;height:1px;border:0;position:absolute;left:-9999px';
  f.onload=function(){
    var w=f.contentWindow;
    say('Après chargement : openSpace est '+typeof w.openSpace+', startSelling est '+typeof w.startSelling);
    try{say('Variables : '+w.eval("typeof db+' / '+typeof currentUser"))}catch(x){say('Variables : '+x.message)}
    say('Terminé.');
  };
  f.srcdoc=patched;
  document.body.appendChild(f);
}
run();
</script></body></html>
